<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTS UI 示例</title>
    <link rel="stylesheet" href="dist/hts-ui.css">
    <script>
    (function(){try{var m=localStorage.getItem('hts-theme')||'system';var h=document.documentElement;if(m==='light'||m==='dark')h.setAttribute('data-theme',m);}catch(e){}})();
    </script>
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <div class="logo"><span class="logo-text">HTS UI</span></div>
            <nav class="nav">
                <select class="theme-select">
                    <option value="system">系统默认</option>
                    <option value="light">浅色模式</option>
                    <option value="dark">深色模式</option>
                </select>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top:48px;padding-bottom:80px">
        <h1 style="font-size:32px;letter-spacing:2px">组件示例</h1>

        <h2 style="margin:32px 0 16px;font-size:20px">按钮</h2>
        <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
            <button class="btn" style="margin-top:0">主要按钮</button>
            <button class="btn btn-plain" style="margin-top:0">次要按钮</button>
            <button class="btn btn-sm" style="margin-top:0">小号</button>
            <button class="btn" style="margin-top:0" disabled>禁用</button>
        </div>

        <h2 style="margin:32px 0 16px;font-size:20px">表单</h2>
        <div style="display:flex;flex-direction:column;gap:16px;max-width:420px">
            <input class="input" placeholder="输入框">
            <select class="select"><option>下拉框</option><option>选项二</option></select>
            <textarea class="textarea" placeholder="文本域"></textarea>
            <div style="display:flex;gap:16px;align-items:center">
                <button class="switch" type="button"></button><span style="font-size:14px">开关</span>
                <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox"> 复选框</label>
            </div>
        </div>

        <h2 style="margin:32px 0 16px;font-size:20px">标签 / 进度</h2>
        <div style="display:flex;gap:12px;margin-bottom:16px">
            <span class="tag tag-dark">进行中</span><span class="tag">已完成</span>
        </div>
        <div class="progress" style="max-width:420px"><div class="progress-bar" style="width:60%"></div></div>

        <h2 style="margin:32px 0 16px;font-size:20px">表格</h2>
        <div class="table-wrap">
            <table class="table">
                <thead><tr><th>名称</th><th>状态</th></tr></thead>
                <tbody><tr><td>HTS官网</td><td>在线</td></tr></tbody>
            </table>
        </div>

        <h2 style="margin:32px 0 16px;font-size:20px">弹窗 / Toast</h2>
        <div style="display:flex;gap:16px">
            <button class="btn" style="margin-top:0" data-hts-modal="demoModal">打开弹窗</button>
            <button class="btn btn-plain" style="margin-top:0" onclick="HTSUI.toast('这是一条提示')">显示 Toast</button>
        </div>

        <h2 style="margin:32px 0 16px;font-size:20px">代码框</h2>
        <div class="code-box">
            <div class="code-box-head"><span class="code-box-lang">HTML</span><button class="code-copy">复制</button></div>
            <pre><code>&lt;button class="btn"&gt;主要按钮&lt;/button&gt;</code></pre>
        </div>
    </main>

    <div class="modal-mask" id="demoModal">
        <div class="modal-box">
            <button class="modal-close">×</button>
            <p class="modal-title">演示弹窗</p>
            <p style="font-size:14px;color:var(--text-soft)">ESC / 遮罩 / × 均可关闭</p>
        </div>
    </div>

    <footer class="footer">
        <p>HTS UI v1.0 · MIT · © 2026 HTStudiocent</p>
    </footer>

    <script src="dist/hts-ui.js"></script>
</body>
</html>
